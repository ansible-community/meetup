---
site_name: Ansible Community Meetups
site_url: https://meetuptoolkit.readthedocs.io/
repo_url: https://github.com/ansible-community/meetup
edit_uri: blob/main/docs
strict: true
use_directory_urls: false

theme:
  name: "ansible"
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - navigation.indexes
    - navigation.tracking
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      primary: teal
      accent: blue
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Start here: index.md
  - Attendees:
      - attendees/index.md
      - Find an event and RSVP: attendees/find-and-rsvp.md
      - Participate and follow up: attendees/participate-and-follow-up.md
  - Organisers:
      - organisers/index.md
      - What it means to be an organiser: organisers/role.md
      - Set up a Meetup: organisers/setup-a-meetup.md
      - Promote a Meetup: organisers/promote-a-meetup.md
      - Event day: organisers/event-day.md
      - After the Meetup: organisers/after-the-meetup.md
  - Ansible Community Team:
      - community-team/index.md
      - Provisioning: community-team/provisioning.md
      - Adding a city: community-team/adding-a-city.md
      - Creating an event: community-team/creating-an-event.md
      - Managing organisers: community-team/managing-organisers.md
      - Community reports: community-team/reports.md
      - Troubleshooting: community-team/troubleshooting.md
  - Strategy: ansible_meetup_strategy.md
  - Reference and contributing:
      - Tooling specification: reference/tooling-specification.md
      - Pretix–Discourse authentication: reference/pretix-discourse-auth-specification.md
      - Glossary: glossary.md
      - Contributing: contributing/contributing.md
      - Important links: resources/important_links.md
      - Email templates:
          - resources/email_templates/speaker_outreach_for_the_first_time.md
          - resources/email_templates/follow-up_email_for_the_speaker.md
          - resources/email_templates/once_the_speaker_confirms_for_the_talk.md
          - resources/email_templates/speaker_communication_once_the_event_is_announced.md
          - resources/email_templates/venue_scout_for_the_first_time.md
          - resources/email_templates/venue_scout_follow_up.md
          - resources/email_templates/venue_scout_post_confirmation.md
          - resources/email_templates/sponsor_reaching_out_for_the_first_time.md
          - resources/email_templates/sponsor_follow_up.md
          - resources/email_templates/sponsor_venue_post_confirmation.md
          - resources/email_templates/sponsor_food_post_confirmation.md
          - resources/email_templates/sponsor_supporter_post_confirmation.md
      - Social media templates:
          - resources/social_media_post_templates/pre_event_post_templates.md
          - resources/social_media_post_templates/during_event_post_templates.md
      - Logo: resources/logo.md
  - Temporary legacy Meetup Pro migration:
      - legacy/meetup_pro/member-migration.md
      - legacy/meetup_pro/exporting-groups.md
      - legacy/meetup_pro/exporting-organisers.md

exclude_docs:
  README.md

plugins:
  - autorefs
  - markdown-exec
  - search

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.magiclink:
      repo_url_shortener: true
      repo_url_shorthand: true
      social_url_shorthand: true
      social_url_shortener: true
      user: facelessuser
      repo: pymdown-extensions
      normalize_issue_symbols: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      toc_depth: 2
      permalink: true
