name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python and documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check tools/ tests/
      - name: Check formatting
        run: uv run ruff format --check tools/ tests/
      - name: Type check
        run: uv run pyright --verbose tools/
      - name: Build documentation
        run: uv run mkdocs build --strict
      - name: Analyze GitHub Actions workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
